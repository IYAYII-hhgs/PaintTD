buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.9.3"
    classpath "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - project(':android')) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'PaintTD'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

// https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
// The article can be helpful when using assets.txt in your project.
tasks.register("generateAssetList") {
  group = "assets"
  description = "Generate assets/assets.txt from the shared assets directory."

  dependsOn(tasks.named("packTextures"))

  def assetsFolder = rootProject.file("assets")
  def assetsFile = rootProject.file("assets/assets.txt")

  inputs.files(fileTree(assetsFolder) {
    exclude "assets.txt"
  })
  outputs.file(assetsFile)

  doLast {
    def lines = fileTree(assetsFolder) {
      exclude "assets.txt"
    }.files.collect { file ->
      assetsFolder.toPath().relativize(file.toPath()).toString().replace('\\', '/')
    }.sort()

    assetsFile.text = lines.isEmpty() ? "" : lines.join("\n") + "\n"
  }
}

eclipse.project.name = 'PaintTD' + '-parent'

def atlasInputDir = file("assets-raw")
def atlasOutputDir = file("assets/atlas")
def atlasName = "textures"

tasks.register("packTextures") {
  group = "assets"
  description = "Pack raw textures into a libGDX atlas."

  inputs.dir(atlasInputDir)
  outputs.dir(atlasOutputDir)
  onlyIf { atlasInputDir.exists() }

  doLast {
    delete(atlasOutputDir)
    atlasOutputDir.mkdirs()

    logger.lifecycle("Packing atlas: ${atlasInputDir} -> ${atlasOutputDir}/${atlasName}.atlas")
    com.badlogic.gdx.tools.texturepacker.TexturePacker.process(
            atlasInputDir.absolutePath,
            atlasOutputDir.absolutePath,
            atlasName
    )
  }
}

// 让 desktop 的现有资源链路先打图集，再生成 assets.txt，再 processResources
project(":lwjgl3") {
  tasks.named("processResources") {
    dependsOn(rootProject.tasks.named("generateAssetList"))
  }
}
// android 资源依赖
project(":android") {
  plugins.withId("com.android.application") {
    tasks.matching { it.name == "preBuild" }.configureEach {
      dependsOn(rootProject.tasks.named("generateAssetList"))
    }
  }
}